[package]
name = "pane-dash"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "control"
path = "tests/control.rs"

[[test]]
name = "live_transport"
path = "tests/live_transport.rs"

[[test]]
name = "preview"
path = "tests/preview.rs"

[[test]]
name = "render"
path = "tests/render.rs"

[[test]]
name = "creation_integration"
path = "tests/creation_integration.rs"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "=0.3.32"
nucleo-matcher = "0.3.1"
ratatui = "0.30"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync", "io-util", "test-util"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
criterion = "0.7"
insta = "1"
tempfile = "3"

[[bench]]
name = "core"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
