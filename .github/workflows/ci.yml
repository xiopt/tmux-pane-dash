name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run version:check

  rust:
    needs: version-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy --component rustfmt --no-self-update
          export RUSTUP_TOOLCHAIN=1.96.1
          test "$(rustc --version | awk '{print $2}')" = "1.96.1"
          cargo fmt --all --manifest-path pane-dash/Cargo.toml -- --check
          cargo clippy --workspace --all-targets --all-features --manifest-path pane-dash/Cargo.toml -- -D warnings
          cargo test --workspace --locked --manifest-path pane-dash/Cargo.toml
          cargo test --workspace --locked --manifest-path pane-dash/Cargo.toml -- --ignored
      - run: |
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- bats tests
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- shellcheck pane_dash.tmux scripts/*.sh tests/*.sh spike/*.sh spike/probes/*.sh spike/perf/*.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/integration.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/pane_dash_integration.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/rust_engine_integration.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/rust_engine_quoting_integration.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/rust_live_integration.sh

  ci-cli:
    needs: rust
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: |
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun install --frozen-lockfile
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- npm pack --dry-run --workspace packages/tmux-pane-dash
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun test scripts/release/tests
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun test opencode-plugin/tests packages/tmux-pane-dash/tests

  four-targets:
    needs: ci-cli
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-arm64, linux-x64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: |
          case "${{ matrix.target }}" in
            darwin-arm64) rust_target=aarch64-apple-darwin ;;
            darwin-x64) rust_target=x86_64-apple-darwin ;;
            linux-arm64) rust_target=aarch64-unknown-linux-musl ;;
            linux-x64) rust_target=x86_64-unknown-linux-musl ;;
          esac
          printf 'target=%s rust-target=%s\n' "${{ matrix.target }}" "$rust_target"
          TARGET_KEY="${{ matrix.target }}" tests/release/with-rust.sh -- tests/release/with-npa.sh -- tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun scripts/release/spikes.ts --musl "${{ matrix.target }}" --network=none
          TARGET_KEY="${{ matrix.target }}" tests/release/with-rust.sh -- tests/release/with-npa.sh -- tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun test packages/tmux-pane-dash/tests/packed-e2e.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-target-${{ matrix.target }}
          path: spike/results
          if-no-files-found: ignore

  cli-tests:
    needs: four-targets
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun run pack:check
      - run: PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun test packages/tmux-pane-dash/tests

  installer-faults:
    needs: cli-tests
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun test packages/tmux-pane-dash/tests --test-name-pattern 'fault|rollback|concurr|archive|config'

  packed-e2e:
    needs: installer-faults
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-target-*
          path: ${{ runner.temp }}/ci-targets
          merge-multiple: true
      - run: PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun test packages/tmux-pane-dash/tests/packed-e2e.test.ts

  opencode-compatibility:
    needs: cli-tests
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: |
          export npm_config_cache="$RUNNER_TEMP/opencode-npm-cache"
          export npm_config_userconfig="$RUNNER_TEMP/opencode.npmrc"
          printf '%s\n' 'registry=https://registry.npmjs.org/' 'audit=false' 'fund=false' > "$npm_config_userconfig"
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$NPM_20_CLI" install --prefix "$RUNNER_TEMP/opencode-min" --ignore-scripts --no-audit --no-fund --package-lock=false opencode-ai@1.17.20
          export OPENCODE_LATEST_VERSION="$(PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$NPM_20_CLI" view opencode-ai dist-tags.latest)"
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun test opencode-plugin/tests/real-opencode.test.ts

  archive-dry-run:
    needs: packed-e2e
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun scripts/release/dry-run.ts
