name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run version:check

  rust:
    needs: version-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - name: Provision distro Bats
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bats
          test "$(command -v bats)" = "/usr/bin/bats"
          bats_version=$(/usr/bin/bats --version)
          test -n "$bats_version"
          [[ "$bats_version" =~ ^Bats[[:space:]]+([1-9][0-9]*)\. ]] || { printf 'unexpected Bats version: %s\n' "$bats_version" >&2; exit 1; }
      - run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy --component rustfmt --no-self-update
          export RUSTUP_TOOLCHAIN=1.96.1
          test "$(rustc --version | awk '{print $2}')" = "1.96.1"
          cargo fmt --all --manifest-path pane-dash/Cargo.toml -- --check
          cargo clippy --workspace --all-targets --all-features --manifest-path pane-dash/Cargo.toml -- -D warnings
          cargo test --workspace --locked --manifest-path pane-dash/Cargo.toml -- --test-threads=1
          cargo test --workspace --locked --manifest-path pane-dash/Cargo.toml -- --ignored --test-threads=1
          make build
          test -x bin/pane-dash
          test "$(bin/pane-dash --version)" = "pane-dash 0.1.2"
      - run: |
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- bats tests
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- shellcheck pane_dash.tmux scripts/*.sh tests/*.sh spike/*.sh spike/probes/*.sh spike/perf/*.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/integration.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/pane_dash_integration.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/pane_dash_pty_helper_test.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/rust_engine_integration.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/rust_engine_quoting_integration.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/rust_live_integration.sh
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- tests/source_package.sh

  ci-cli:
    needs: rust
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal --no-self-update
          export RUSTUP_TOOLCHAIN=1.96.1
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo build --release --locked --manifest-path pane-dash/Cargo.toml --target x86_64-unknown-linux-musl
          mkdir -p bin
          install -m0755 pane-dash/target/x86_64-unknown-linux-musl/release/pane-dash bin/pane-dash
          test -x bin/pane-dash
          test "$(bin/pane-dash --version)" = "pane-dash 0.1.2"
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: |
          echo "NODE_20_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "NPM_20_CLI=$(command -v npm)" >> "$GITHUB_ENV"
      - run: |
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun install --frozen-lockfile
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- npm pack --dry-run --workspace packages/tmux-pane-dash
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-npa.sh -- env \
            PANE_DASH_NODE20_PREPROVIDED=1 NODE_20_BIN="$NODE_20_BIN" NPM_20_CLI="$NPM_20_CLI" \
            tests/release/with-node20.sh -- scripts/release/clean-room.sh -- \
            bun test scripts/release/tests release/tests
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun test opencode-plugin/tests/normalize.test.ts opencode-plugin/tests/pane-dash.test.ts opencode-plugin/tests/real-opencode-rows.test.ts opencode-plugin/tests/state.test.ts opencode-plugin/tests/writer.test.ts

  four-targets:
    needs: ci-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
          - target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
          - target: linux-x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN=1.96.1
          rustup toolchain install 1.96.1 --profile minimal --no-self-update
          rustup target add "${{ matrix.rust_target }}"
          if [[ "${{ matrix.rust_target }}" == *unknown-linux-musl ]]; then sudo apt-get update; sudo apt-get install -y musl-tools; fi
          cargo build --release --locked --manifest-path pane-dash/Cargo.toml --target "${{ matrix.rust_target }}"
          cargo test --workspace --locked --manifest-path pane-dash/Cargo.toml --target "${{ matrix.rust_target }}" -- --test-threads=1
          test -x "pane-dash/target/${{ matrix.rust_target }}/release/pane-dash"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-target-${{ matrix.target }}
          path: pane-dash/target/${{ matrix.rust_target }}/release/pane-dash
          if-no-files-found: error

  cli-tests:
    needs: four-targets
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: |
          echo "NODE_20_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "NPM_20_CLI=$(command -v npm)" >> "$GITHUB_ENV"
      - run: PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun run pack:check
      - run: PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun test packages/tmux-pane-dash/tests/acquire.test.ts packages/tmux-pane-dash/tests/archive.test.ts packages/tmux-pane-dash/tests/args.test.ts packages/tmux-pane-dash/tests/config-files.test.ts packages/tmux-pane-dash/tests/config-opencode-migration.test.ts packages/tmux-pane-dash/tests/config-opencode.test.ts packages/tmux-pane-dash/tests/config-tmux.test.ts packages/tmux-pane-dash/tests/doctor.test.ts packages/tmux-pane-dash/tests/errors.test.ts packages/tmux-pane-dash/tests/fs.test.ts packages/tmux-pane-dash/tests/journal.test.ts packages/tmux-pane-dash/tests/lock.test.ts packages/tmux-pane-dash/tests/manifest.test.ts packages/tmux-pane-dash/tests/migration.test.ts packages/tmux-pane-dash/tests/ownership.test.ts packages/tmux-pane-dash/tests/platform.test.ts packages/tmux-pane-dash/tests/runtime.test.ts packages/tmux-pane-dash/tests/setup.test.ts packages/tmux-pane-dash/tests/tmux-quote-e2e.test.ts packages/tmux-pane-dash/tests/transaction.test.ts packages/tmux-pane-dash/tests/uninstall.test.ts packages/tmux-pane-dash/tests/update.test.ts

  installer-faults:
    needs: cli-tests
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: |
          echo "NODE_20_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "NPM_20_CLI=$(command -v npm)" >> "$GITHUB_ENV"
      - run: PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun test packages/tmux-pane-dash/tests --test-name-pattern 'fault|rollback|concurr|archive|config'

  packed-e2e:
    needs: installer-faults
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: |
          echo "NODE_20_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "NPM_20_CLI=$(command -v npm)" >> "$GITHUB_ENV"
      - name: Bind packed E2E tmux to doctor PATH
        shell: bash
        run: |
          set -euo pipefail
          test -x "${TMUX_BIN:?TMUX_BIN is required}"
          test "$("$TMUX_BIN" -V)" = "tmux 3.6a"
          tmux_real="$(realpath -- "$TMUX_BIN")"
          test -x "$tmux_real"
          test "$("$tmux_real" -V)" = "tmux 3.6a"
          sudo ln -sfn -- "$TMUX_BIN" /usr/local/bin/tmux
          test -L /usr/local/bin/tmux
          test "$(realpath -- /usr/local/bin/tmux)" = "$tmux_real"
          test "$(/usr/local/bin/tmux -V)" = "tmux 3.6a"
      - name: Provision packed E2E musl target
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          export RUSTUP_BOOTSTRAP="$(command -v rustup)"
          test -x "$RUSTUP_BOOTSTRAP"
          tests/release/with-rust.sh -- "$RUSTUP_BOOTSTRAP" target add x86_64-unknown-linux-musl --toolchain 1.96.1
          tests/release/with-rust.sh -- bash -ceu '
            test "$RUSTUP_HOME" = "$PANE_DASH_ISOLATED_RUST_ROOT/rustup"
            test "$CARGO_HOME" = "$PANE_DASH_ISOLATED_RUST_ROOT/cargo"
            [[ "$CARGO" == "$PANE_DASH_ISOLATED_RUST_ROOT"/rustup/toolchains/1.96.1-*/bin/cargo ]]
          '
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-target-*
          path: ${{ runner.temp }}/ci-targets
          merge-multiple: true
      - run: |
          set -euo pipefail
          node -e 'if (process.version !== "v20.0.0") process.exit(1)'
          export NODE_20_BIN="${NODE_20_BIN:?NODE_20_BIN is required}" NPM_20_CLI="${NPM_20_CLI:?NPM_20_CLI is required}"
          export BUN_BOOTSTRAP="${BUN_BOOTSTRAP:?BUN_BOOTSTRAP is required}"
          export TMUX_BIN="${TMUX_BIN:?TMUX_BIN is required}" TARGET_KEY=linux-x64
          tests/release/with-rust.sh -- env \
            PANE_DASH_NODE20_PREPROVIDED=1 NODE_20_BIN="$NODE_20_BIN" NPM_20_CLI="$NPM_20_CLI" \
            tests/release/with-node20.sh -- scripts/release/clean-room.sh -- \
            "$BUN_BOOTSTRAP" test packages/tmux-pane-dash/tests/packed-e2e.test.ts

  opencode-compatibility:
    needs: cli-tests
    runs-on: macos-14
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: |
          echo "NODE_20_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "NPM_20_CLI=$(command -v npm)" >> "$GITHUB_ENV"
      - run: |
          export npm_config_cache="$RUNNER_TEMP/opencode-npm-cache"
          export npm_config_userconfig="$RUNNER_TEMP/opencode.npmrc"
          printf '%s\n' 'registry=https://registry.npmjs.org/' 'audit=false' 'fund=false' > "$npm_config_userconfig"
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$NPM_20_CLI" install --prefix "$RUNNER_TEMP/opencode-min" --ignore-scripts --no-audit --no-fund --package-lock=false opencode-ai@1.17.20
          run_opencode_postinstall() {
            local prefix=$1
            local postinstall="$prefix/node_modules/opencode-ai/postinstall.mjs"
            test -f "$postinstall"
            PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$NODE_20_BIN" "$postinstall"
          }
          run_opencode_postinstall "$RUNNER_TEMP/opencode-min"
          export OPENCODE_LATEST_VERSION="$(PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$NPM_20_CLI" view opencode-ai dist-tags.latest)"
          [[ "$OPENCODE_LATEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$NPM_20_CLI" install --prefix "$RUNNER_TEMP/opencode-latest" --ignore-scripts --no-audit --no-fund --package-lock=false "opencode-ai@$OPENCODE_LATEST_VERSION"
          run_opencode_postinstall "$RUNNER_TEMP/opencode-latest"
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$NPM_20_CLI" view opencode-ai@1.17.20 version dist.integrity --json
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$NPM_20_CLI" view "opencode-ai@$OPENCODE_LATEST_VERSION" version dist.integrity --json
          export OPENCODE_1_17_20_BIN="$RUNNER_TEMP/opencode-min/node_modules/.bin/opencode"
          export OPENCODE_LATEST_BIN="$RUNNER_TEMP/opencode-latest/node_modules/.bin/opencode"
          test -x "$OPENCODE_1_17_20_BIN" && test -x "$OPENCODE_LATEST_BIN"
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$OPENCODE_1_17_20_BIN" --version
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$OPENCODE_LATEST_BIN" --version
          export BUN_BOOTSTRAP="$(command -v bun)"
          run_isolated() { tests/release/with-npa.sh -- env PANE_DASH_NODE20_PREPROVIDED=1 NODE_20_BIN="$NODE_20_BIN" NPM_20_CLI="$NPM_20_CLI" tests/release/with-node20.sh -- scripts/release/clean-room.sh -- "$@"; }
          run_isolated bun test opencode-plugin/tests/real-opencode.test.ts

  archive-dry-run:
    needs: packed-e2e
    runs-on: ubuntu-24.04
    env:
      PANE_DASH_NODE20_PREPROVIDED: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - run: node -e 'if (process.version !== "v20.0.0") process.exit(1)'
      - run: |
          echo "NODE_20_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "NPM_20_CLI=$(command -v npm)" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- scripts/release/clean-room.sh -- bun scripts/release/dry-run.ts
