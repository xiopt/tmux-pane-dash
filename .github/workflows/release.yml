name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NPM_TRUSTED_PUBLISHER_EXPECTED: '{"packages":{"@xiopt/pane-dash-opencode":{"allowedAction":"npm publish","environment":"npm-production","repository":"xiopt/tmux-pane-dash","workflow":"release.yml"},"@xiopt/tmux-pane-dash":{"allowedAction":"npm publish","environment":"npm-production","repository":"xiopt/tmux-pane-dash","workflow":"release.yml"}},"schemaVersion":1}'

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate synchronized protected tag graph
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected_tag="v$version"
          test "$GITHUB_REF" = "refs/tags/$expected_tag"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          github_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          tag_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          test "$tag_commit" = "$github_commit"
          git merge-base --is-ancestor "$github_commit" refs/remotes/origin/master
          origin_url="$(git remote get-url origin)"
          [[ "$origin_url" == "https://github.com/xiopt/tmux-pane-dash" || "$origin_url" == "https://github.com/xiopt/tmux-pane-dash.git" ]]

  build-test:
    needs: validate-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - name: Provision distro Bats
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bats
          test "$(command -v bats)" = "/usr/bin/bats"
          bats_version=$(/usr/bin/bats --version)
          test -n "$bats_version"
          [[ "$bats_version" =~ ^Bats[[:space:]]+([1-9][0-9]*)\. ]] || { printf 'unexpected Bats version: %s\n' "$bats_version" >&2; exit 1; }
      - name: Rust formatting and tests
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt --no-self-update
          export RUSTUP_TOOLCHAIN=1.96.1
          cargo fmt --all --manifest-path pane-dash/Cargo.toml -- --check
          cargo test --workspace --locked --manifest-path pane-dash/Cargo.toml -- --test-threads=1
      - name: Shell tests
        run: |
          set -euo pipefail
          tests/release/with-rust.sh -- scripts/release/clean-room.sh -- bats tests

  build-four-targets:
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            asset: tmux-pane-dash-v0.1.8-aarch64-apple-darwin.tar.gz
          - target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            asset: tmux-pane-dash-v0.1.8-x86_64-apple-darwin.tar.gz
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            asset: tmux-pane-dash-v0.1.8-aarch64-unknown-linux-musl.tar.gz
          - target: linux-x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            asset: tmux-pane-dash-v0.1.8-x86_64-unknown-linux-musl.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - name: Build and test the matching target
        shell: bash
        env:
          TARGET_KEY: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal --no-self-update
          export RUSTUP_TOOLCHAIN=1.96.1
          rustup target add "${RUST_TARGET}"
          if [[ "$RUST_TARGET" == *unknown-linux-musl ]]; then
            if command -v brew >/dev/null 2>&1; then brew install filosottile/musl-cross/musl-cross; fi
            if command -v apt-get >/dev/null 2>&1; then sudo apt-get update; sudo apt-get install -y musl-tools; fi
          fi
          cargo build --release --locked --manifest-path pane-dash/Cargo.toml --target "${RUST_TARGET}"
          cargo test --workspace --locked --manifest-path pane-dash/Cargo.toml --target "${RUST_TARGET}" -- --test-threads=1
          BINARY="pane-dash/target/${RUST_TARGET}/release/pane-dash"
          test -x "$BINARY"
          mkdir -p "$RUNNER_TEMP/target-release"
          bun scripts/release/build.ts --target "${TARGET_KEY}" --binary "$BINARY" --tag-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/target-release"
          test -f "$RUNNER_TEMP/target-release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: target-${{ matrix.target }}
          path: ${{ runner.temp }}/target-release/${{ matrix.asset }}
          if-no-files-found: error

  assemble-verified:
    needs: [build-test, build-four-targets]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      NPM_TRUSTED_PUBLISHER_BINDING: ${{ vars.NPM_TRUSTED_PUBLISHER_BINDING }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - name: Preserve exact Node 20 tools
        shell: bash
        run: |
          set -euo pipefail
          node -e 'if (process.version !== "v20.0.0") process.exit(1)'
          printf 'NODE_20_BIN=%s\nNPM_20_CLI=%s\n' "$(command -v node)" "$(command -v npm)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: target-*
          merge-multiple: true
          path: ${{ runner.temp }}/target-archives
      - name: Assemble immutable handoff
        shell: bash
        run: |
          set -euo pipefail
          export NODE_24_BIN="$(command -v node)"
          test "$($NODE_24_BIN --version)" = "v24.12.0"
          test "$(npm --version)" = "11.6.2"
          bun install --frozen-lockfile
          release_dir="$RUNNER_TEMP/release"
          npm_dir="$RUNNER_TEMP/npm"
          handoff_dir="$RUNNER_TEMP/verified-handoff"
          mkdir -p "$release_dir" "$npm_dir" "$handoff_dir"
          for asset in \
            tmux-pane-dash-v0.1.8-aarch64-apple-darwin.tar.gz \
            tmux-pane-dash-v0.1.8-x86_64-apple-darwin.tar.gz \
            tmux-pane-dash-v0.1.8-aarch64-unknown-linux-musl.tar.gz \
            tmux-pane-dash-v0.1.8-x86_64-unknown-linux-musl.tar.gz; do
            test -f "$RUNNER_TEMP/target-archives/$asset"
            cp -n "$RUNNER_TEMP/target-archives/$asset" "$release_dir/$asset"
          done
          test "$(find "$release_dir" -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 4
          bun scripts/release/build.ts --assemble --tag-commit "$GITHUB_SHA" --output "$release_dir"
          test ! -e release/dist
          bun scripts/release/package-build.ts --release-manifest "$release_dir/release-manifest.json" --require-change
          PANE_DASH_NODE20_PREPROVIDED=1 tests/release/with-node20.sh -- bun scripts/release/verify-artifacts.ts --packages --release-manifest "$release_dir/release-manifest.json"
          npm pack --workspace packages/tmux-pane-dash --workspace opencode-plugin --pack-destination "$npm_dir"
          test -n "${NPM_TRUSTED_PUBLISHER_BINDING:?NPM_TRUSTED_PUBLISHER_BINDING is required}"
          test "$NPM_TRUSTED_PUBLISHER_BINDING" = "$NPM_TRUSTED_PUBLISHER_EXPECTED"
          bun build release/verify-npm-provenance.ts --bundle --target=node --format=esm --outfile="$RUNNER_TEMP/verify-npm-provenance.mjs"
          test -s "$RUNNER_TEMP/verify-npm-provenance.mjs"
          "$NODE_24_BIN" --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdirSync, statSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const hash = (algorithm, path) => createHash(algorithm).update(readFileSync(path)).digest("hex");
          const integrity = (path) => `sha512-${createHash("sha512").update(readFileSync(path)).digest("base64")}`;
          const release = process.env.RUNNER_TEMP + "/release";
          const npm = process.env.RUNNER_TEMP + "/npm";
          const packageFiles = readdirSync(npm).filter((name) => name.endsWith(".tgz")).sort();
          const expectedPackages = ["xiopt-pane-dash-opencode-0.1.8.tgz", "xiopt-tmux-pane-dash-0.1.8.tgz"];
          if (JSON.stringify(packageFiles) !== JSON.stringify(expectedPackages)) throw new Error("npm package inventory is not exact");
          const assets = ["tmux-pane-dash-v0.1.8-aarch64-apple-darwin.tar.gz", "tmux-pane-dash-v0.1.8-x86_64-apple-darwin.tar.gz", "tmux-pane-dash-v0.1.8-aarch64-unknown-linux-musl.tar.gz", "tmux-pane-dash-v0.1.8-x86_64-unknown-linux-musl.tar.gz", "release-manifest.json", "SHA256SUMS"];
          if (readdirSync(release).sort().join(",") !== assets.slice().sort().join(",")) throw new Error("release asset inventory is not exact");
          const releaseAssets = Object.fromEntries(assets.map((name) => [name, hash("sha256", join(release, name))]));
           const packageInventory = { "@xiopt/pane-dash-opencode": { filename: expectedPackages[0], integrity: integrity(join(npm, expectedPackages[0])) }, "@xiopt/tmux-pane-dash": { filename: expectedPackages[1], integrity: integrity(join(npm, expectedPackages[1])) } };
           const verifierPath = process.env.RUNNER_TEMP + "/verify-npm-provenance.mjs";
           const verifier = readFileSync(verifierPath);
           const handoff = { schemaVersion: 1, tagCommit: process.env.GITHUB_SHA, npm: packageInventory, verifier: { filename: "verify-npm-provenance.mjs", sha256: hash("sha256", verifierPath), size: verifier.length }, trustedPublishers: { "@xiopt/pane-dash-opencode": { repository: "xiopt/tmux-pane-dash", workflow: "release.yml", environment: "npm-production", allowedAction: "npm publish" }, "@xiopt/tmux-pane-dash": { repository: "xiopt/tmux-pane-dash", workflow: "release.yml", environment: "npm-production", allowedAction: "npm publish" } }, releaseAssets };
           if (handoff.tagCommit !== process.env.GITHUB_SHA) throw new Error("handoff commit mismatch");
           const canonical = (value) => Array.isArray(value) ? `[${value.map(canonical).join(",")}]` : value !== null && typeof value === "object" ? `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}` : JSON.stringify(value);
           writeFileSync(process.env.RUNNER_TEMP + "/verified-handoff/verified-handoff.json", canonical(handoff) + "\n", { mode: 0o600 });
          writeFileSync(process.env.RUNNER_TEMP + "/verified-handoff/verify-npm-provenance.mjs", verifier, { mode: 0o600 });
          NODE
          test ! -e release/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/release-manifest.json
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-handoff
          path: ${{ runner.temp }}/verified-handoff/*
          if-no-files-found: error

  draft-release:
    needs: assemble-verified
    runs-on: ubuntu-24.04
    environment: github-draft
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-handoff
          path: ${{ runner.temp }}/verified-handoff
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: ${{ runner.temp }}/release
      - name: Verify handoff before draft mutation
        shell: bash
        run: |
          set -euo pipefail
          export NODE_24_BIN="$(command -v node)"
          export VERIFIED_HANDOFF="$RUNNER_TEMP/verified-handoff/verified-handoff.json"
           export VERIFIER_BUNDLE="$RUNNER_TEMP/verified-handoff/verify-npm-provenance.mjs"
           test -f "$VERIFIED_HANDOFF"
           test -f "$VERIFIER_BUNDLE"
           "$NODE_24_BIN" -e 'const fs=require("node:fs"),c=require("node:crypto");const [h,b]=process.argv.slice(1),j=JSON.parse(fs.readFileSync(h,"utf8")),x=fs.readFileSync(b);if(j.verifier.filename!=="verify-npm-provenance.mjs"||j.verifier.size!==x.length||j.verifier.sha256!==c.createHash("sha256").update(x).digest("hex"))process.exit(1)' "$VERIFIED_HANDOFF" "$VERIFIER_BUNDLE"
          "$NODE_24_BIN" --input-type=module - "$VERIFIED_HANDOFF" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const handoff = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const release = process.env.RUNNER_TEMP + "/release";
          const assets = Object.keys(handoff.releaseAssets).sort();
          const expected = ["SHA256SUMS", "release-manifest.json", "tmux-pane-dash-v0.1.8-aarch64-apple-darwin.tar.gz", "tmux-pane-dash-v0.1.8-aarch64-unknown-linux-musl.tar.gz", "tmux-pane-dash-v0.1.8-x86_64-apple-darwin.tar.gz", "tmux-pane-dash-v0.1.8-x86_64-unknown-linux-musl.tar.gz"];
          if (JSON.stringify(assets) !== JSON.stringify(expected)) throw new Error("handoff asset inventory is not exact");
          for (const asset of expected) { const bytes = readFileSync(join(release, asset)); if (createHash("sha256").update(bytes).digest("hex") !== handoff.releaseAssets[asset]) throw new Error(`asset handoff mismatch: ${asset}`); }
          NODE
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "release already exists" >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "Validated release $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/release/*.tar.gz "$RUNNER_TEMP"/release/release-manifest.json "$RUNNER_TEMP"/release/SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/release-manifest.json
            ${{ runner.temp }}/release/SHA256SUMS

  validate-draft:
    needs: draft-release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Provision CI tmux and Bun paths
        shell: bash
        run: |
          set -euo pipefail
          export TMUX_BIN="$(scripts/release/ci-tmux.sh)" BUN_BOOTSTRAP="$(command -v bun)"
          test -x "$TMUX_BIN"
          test -x "$BUN_BOOTSTRAP"
          test "$($BUN_BOOTSTRAP --version)" = "1.3.14"
          printf 'TMUX_BIN=%s\nBUN_BOOTSTRAP=%s\n' "$TMUX_BIN" "$BUN_BOOTSTRAP" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-handoff
          path: ${{ runner.temp }}/verified-handoff
      - name: Verify handoff before reading draft
        shell: bash
        run: |
          set -euo pipefail
          export NODE_24_BIN="$(command -v node)"
          export VERIFIED_HANDOFF="$RUNNER_TEMP/verified-handoff/verified-handoff.json"
          export VERIFIER_BUNDLE="$RUNNER_TEMP/verified-handoff/verify-npm-provenance.mjs"
          test -f "$VERIFIED_HANDOFF"
          test -f "$VERIFIER_BUNDLE"
          "$NODE_24_BIN" -e 'const fs=require("node:fs"),c=require("node:crypto");const [h,b]=process.argv.slice(1),j=JSON.parse(fs.readFileSync(h,"utf8")),x=fs.readFileSync(b);if(j.verifier.filename!=="verify-npm-provenance.mjs"||j.verifier.size!==x.length||j.verifier.sha256!==c.createHash("sha256").update(x).digest("hex"))process.exit(1)' "$VERIFIED_HANDOFF" "$VERIFIER_BUNDLE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm
      - name: Validate draft inventory, hashes, architecture, version, and attestations
        shell: bash
        run: |
          set -euo pipefail
          export NODE_24_BIN="$(command -v node)"
           export VERIFIED_HANDOFF="$RUNNER_TEMP/verified-handoff/verified-handoff.json"
           export VERIFIER_BUNDLE="$RUNNER_TEMP/verified-handoff/verify-npm-provenance.mjs"
           release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.tag_name == env.GITHUB_REF_NAME and .draft == true)] | if length == 1 then .[0].id else error("expected one draft release") end')"
           mkdir -p "$RUNNER_TEMP/draft"
           mapfile -t assets < <(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[] | [.id, .name] | @tsv')
           test "${#assets[@]}" -eq 6
           for asset in "${assets[@]}"; do
             IFS=$'\t' read -r asset_id asset_name <<< "$asset"
             case "$asset_name" in
               SHA256SUMS|release-manifest.json|tmux-pane-dash-v0.1.8-aarch64-apple-darwin.tar.gz|tmux-pane-dash-v0.1.8-aarch64-unknown-linux-musl.tar.gz|tmux-pane-dash-v0.1.8-x86_64-apple-darwin.tar.gz|tmux-pane-dash-v0.1.8-x86_64-unknown-linux-musl.tar.gz) ;;
               *) echo "unexpected draft asset: $asset_name" >&2; exit 1 ;;
             esac
             gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/draft/$asset_name"
           done
           test "$(find "$RUNNER_TEMP/draft" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
          "$NODE_24_BIN" --input-type=module - "$VERIFIED_HANDOFF" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const handoff = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const draft = process.env.RUNNER_TEMP + "/draft";
          const npm = process.env.RUNNER_TEMP + "/npm";
          const packageFiles = Object.values(handoff.npm).map((entry) => entry.filename).sort();
          if (JSON.stringify(packageFiles) !== JSON.stringify(["xiopt-pane-dash-opencode-0.1.8.tgz", "xiopt-tmux-pane-dash-0.1.8.tgz"])) throw new Error("handoff npm inventory is not exact");
          for (const entry of Object.values(handoff.npm)) { const bytes = readFileSync(join(npm, entry.filename)); const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`; if (integrity !== entry.integrity) throw new Error(`npm handoff mismatch: ${entry.filename}`); }
          for (const [asset, expected] of Object.entries(handoff.releaseAssets)) if (createHash("sha256").update(readFileSync(join(draft, asset))).digest("hex") !== expected) throw new Error(`draft hash mismatch: ${asset}`);
          const manifest = JSON.parse(readFileSync(join(draft, "release-manifest.json"), "utf8"));
          if (manifest.version !== "0.1.8" || manifest.tag !== "v0.1.8" || Object.keys(manifest.assets).sort().join(",") !== "darwin-arm64,darwin-x64,linux-arm64,linux-x64") throw new Error("version/architecture inventory mismatch");
          NODE
          bun scripts/release/verify-artifacts.ts "$RUNNER_TEMP/draft" --tag-commit "$GITHUB_SHA"
           attestation_assets=(
              "$RUNNER_TEMP/draft/tmux-pane-dash-v0.1.8-aarch64-apple-darwin.tar.gz"
              "$RUNNER_TEMP/draft/tmux-pane-dash-v0.1.8-x86_64-apple-darwin.tar.gz"
              "$RUNNER_TEMP/draft/tmux-pane-dash-v0.1.8-aarch64-unknown-linux-musl.tar.gz"
              "$RUNNER_TEMP/draft/tmux-pane-dash-v0.1.8-x86_64-unknown-linux-musl.tar.gz"
             "$RUNNER_TEMP/draft/release-manifest.json"
             "$RUNNER_TEMP/draft/SHA256SUMS"
           )
           test "${#attestation_assets[@]}" -eq 6
           for asset in "${attestation_assets[@]}"; do
             gh attestation verify "$asset" \
               --repo "$GITHUB_REPOSITORY" \
               --signer-workflow xiopt/tmux-pane-dash/.github/workflows/release.yml \
                --source-ref refs/tags/v0.1.8 \
               --source-digest "$GITHUB_SHA" \
               --signer-digest "$GITHUB_SHA"
           done
           echo "attestation-subjects=6"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.0.0"
      - name: Bind packed E2E tmux to doctor PATH
        shell: bash
        run: |
          set -euo pipefail
          test -x "${TMUX_BIN:?TMUX_BIN is required}"
          test "$("$TMUX_BIN" -V)" = "tmux 3.6a"
          tmux_real="$(realpath -- "$TMUX_BIN")"
          test -x "$tmux_real"
          test "$("$tmux_real" -V)" = "tmux 3.6a"
          sudo ln -sfn -- "$TMUX_BIN" /usr/local/bin/tmux
          test -L /usr/local/bin/tmux
          test "$(realpath -- /usr/local/bin/tmux)" = "$tmux_real"
          test "$(/usr/local/bin/tmux -V)" = "tmux 3.6a"
      - name: Provision packed E2E musl target
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          export RUSTUP_BOOTSTRAP="$(command -v rustup)"
          test -x "$RUSTUP_BOOTSTRAP"
          tests/release/with-rust.sh -- "$RUSTUP_BOOTSTRAP" target add x86_64-unknown-linux-musl --toolchain 1.96.1
          tests/release/with-rust.sh -- bash -ceu '
            test "$RUSTUP_HOME" = "$PANE_DASH_ISOLATED_RUST_ROOT/rustup"
            test "$CARGO_HOME" = "$PANE_DASH_ISOLATED_RUST_ROOT/cargo"
            [[ "$CARGO" == "$PANE_DASH_ISOLATED_RUST_ROOT"/rustup/toolchains/1.96.1-*/bin/cargo ]]
          '
      - name: Run packed E2E with exact Node 20 and isolated Rust and tmux
        shell: bash
        run: |
          set -euo pipefail
          node -e 'if (process.version !== "v20.0.0") process.exit(1)'
          export NODE_20_BIN="$(command -v node)" NPM_20_CLI="$(command -v npm)"
          export BUN_BOOTSTRAP="${BUN_BOOTSTRAP:?BUN_BOOTSTRAP is required}"
          export TMUX_BIN="${TMUX_BIN:?TMUX_BIN is required}" TARGET_KEY=linux-x64
          test -x "$NODE_20_BIN" && test -x "$NPM_20_CLI" && test -x "$BUN_BOOTSTRAP" && test -x "$TMUX_BIN"
          tests/release/with-rust.sh -- env \
            PANE_DASH_NODE20_PREPROVIDED=1 NODE_20_BIN="$NODE_20_BIN" NPM_20_CLI="$NPM_20_CLI" \
            tests/release/with-node20.sh -- scripts/release/clean-room.sh -- \
            "$BUN_BOOTSTRAP" test packages/tmux-pane-dash/tests/packed-e2e.test.ts

  npm-production:
    needs: validate-draft
    runs-on: ubuntu-24.04
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TRUSTED_PUBLISHER_BINDING: ${{ vars.NPM_TRUSTED_PUBLISHER_BINDING }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-handoff
          path: ${{ runner.temp }}/verified-handoff
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm
      - name: Verify handoff before audit or publish
        shell: bash
        run: |
          set -euo pipefail
          export NODE_24_BIN="$(command -v node)"
          export VERIFIED_HANDOFF="$RUNNER_TEMP/verified-handoff/verified-handoff.json"
          export VERIFIER_BUNDLE="$RUNNER_TEMP/verified-handoff/verify-npm-provenance.mjs"
          test -f "$VERIFIED_HANDOFF"
          test -f "$VERIFIER_BUNDLE"
          "$NODE_24_BIN" -e 'if (process.version !== "v24.12.0") process.exit(1)'
          test "$(npm --version)" = "11.6.2"
          "$NODE_24_BIN" -e 'const fs=require("node:fs"),c=require("node:crypto");const [h,b]=process.argv.slice(1),j=JSON.parse(fs.readFileSync(h,"utf8")),x=fs.readFileSync(b);if(j.verifier.filename!=="verify-npm-provenance.mjs"||j.verifier.size!==x.length||j.verifier.sha256!==c.createHash("sha256").update(x).digest("hex"))process.exit(1)' "$VERIFIED_HANDOFF" "$VERIFIER_BUNDLE"
          "$NODE_24_BIN" --input-type=module - "$VERIFIED_HANDOFF" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const handoff = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const npm = process.env.RUNNER_TEMP + "/npm";
          const expected = ["xiopt-pane-dash-opencode-0.1.8.tgz", "xiopt-tmux-pane-dash-0.1.8.tgz"];
          if (Object.values(handoff.npm).map((entry) => entry.filename).sort().join(",") !== expected.join(",")) throw new Error("npm handoff inventory is not exact");
          for (const entry of Object.values(handoff.npm)) { const bytes = readFileSync(join(npm, entry.filename)); if (`sha512-${createHash("sha512").update(bytes).digest("base64")}` !== entry.integrity) throw new Error(`npm handoff hash mismatch: ${entry.filename}`); }
          NODE
           test -n "${NPM_TRUSTED_PUBLISHER_BINDING:?NPM_TRUSTED_PUBLISHER_BINDING is required}"
           test "$NPM_TRUSTED_PUBLISHER_BINDING" = "$NPM_TRUSTED_PUBLISHER_EXPECTED"
            npm publish "$RUNNER_TEMP/npm/xiopt-pane-dash-opencode-0.1.8.tgz" --access public --provenance
            npm publish "$RUNNER_TEMP/npm/xiopt-tmux-pane-dash-0.1.8.tgz" --access public --provenance
           audit_dir="$RUNNER_TEMP/npm-audit"
           mkdir -p "$audit_dir" "$RUNNER_TEMP/npm-audit-cache"
           printf '%s\n' 'registry=https://registry.npmjs.org/' 'audit=false' 'fund=false' > "$audit_dir/.npmrc"
           printf '%s\n' '{"name":"task14-npm-signature-audit","private":true}' > "$audit_dir/package.json"
            for attempt in {1..30}; do
             rm -rf "$audit_dir/node_modules"
             if npm_config_userconfig="$audit_dir/.npmrc" npm_config_cache="$RUNNER_TEMP/npm-audit-cache" npm install --prefix "$audit_dir" --ignore-scripts --no-audit --no-fund --package-lock=false @xiopt/pane-dash-opencode@0.1.8 @xiopt/tmux-pane-dash@0.1.8 \
               && npm_config_userconfig="$audit_dir/.npmrc" npm_config_cache="$RUNNER_TEMP/npm-audit-cache" npm audit signatures --prefix "$audit_dir"; then
               break
             fi
              test "$attempt" -lt 30 || exit 1
             sleep 10
           done
          "$NODE_24_BIN" "$VERIFIER_BUNDLE" --package @xiopt/pane-dash-opencode --version 0.1.8 --handoff "$VERIFIED_HANDOFF" --repository xiopt/tmux-pane-dash --workflow .github/workflows/release.yml --ref refs/tags/v0.1.8
          "$NODE_24_BIN" "$VERIFIER_BUNDLE" --package @xiopt/tmux-pane-dash --version 0.1.8 --handoff "$VERIFIED_HANDOFF" --repository xiopt/tmux-pane-dash --workflow .github/workflows/release.yml --ref refs/tags/v0.1.8

  promote-release:
    needs: npm-production
    runs-on: ubuntu-24.04
    environment: release-promotion
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.12.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.1.2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-handoff
          path: ${{ runner.temp }}/verified-handoff
      - name: Verify immutable handoff before proof collection
        shell: bash
        run: |
          set -euo pipefail
          export NODE_24_BIN="$(command -v node)"
          export VERIFIED_HANDOFF="$RUNNER_TEMP/verified-handoff/verified-handoff.json"
          export VERIFIER_BUNDLE="$RUNNER_TEMP/verified-handoff/verify-npm-provenance.mjs"
          test -f "$VERIFIED_HANDOFF"
          test -f "$VERIFIER_BUNDLE"
          "$NODE_24_BIN" -e 'if (process.version !== "v24.12.0") process.exit(1)'
          "$NODE_24_BIN" -e 'const fs=require("node:fs"),c=require("node:crypto");const [h,b]=process.argv.slice(1),j=JSON.parse(fs.readFileSync(h,"utf8")),x=fs.readFileSync(b);if(j.verifier.filename!=="verify-npm-provenance.mjs"||j.verifier.size!==x.length||j.verifier.sha256!==c.createHash("sha256").update(x).digest("hex"))process.exit(1)' "$VERIFIED_HANDOFF" "$VERIFIER_BUNDLE"
      - name: Reverify published package provenance before promotion
        shell: bash
        run: |
          set -euo pipefail
          export NODE_24_BIN="$(command -v node)"
          export VERIFIED_HANDOFF="$RUNNER_TEMP/verified-handoff/verified-handoff.json"
          export VERIFIER_BUNDLE="$RUNNER_TEMP/verified-handoff/verify-npm-provenance.mjs"
          "$NODE_24_BIN" "$VERIFIER_BUNDLE" --package @xiopt/pane-dash-opencode --version 0.1.8 --handoff "$VERIFIED_HANDOFF" --repository xiopt/tmux-pane-dash --workflow .github/workflows/release.yml --ref refs/tags/v0.1.8
          "$NODE_24_BIN" "$VERIFIER_BUNDLE" --package @xiopt/tmux-pane-dash --version 0.1.8 --handoff "$VERIFIED_HANDOFF" --repository xiopt/tmux-pane-dash --workflow .github/workflows/release.yml --ref refs/tags/v0.1.8
      - name: Prove the active approved release-promotion deployment
        shell: bash
        run: |
          set -euo pipefail
          export NODE_24_BIN="$(command -v node)"
          environment_json="$RUNNER_TEMP/release-promotion-environment.json"
          deployments_json="$RUNNER_TEMP/release-promotion-deployments.json"
          statuses_json="$RUNNER_TEMP/release-promotion-statuses.json"
          jobs_json="$RUNNER_TEMP/release-promotion-jobs.json"
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          gh api "/repos/$GITHUB_REPOSITORY/environments/release-promotion" > "$environment_json"
          gh api "/repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&ref=$GITHUB_REF_NAME&environment=release-promotion&task=deploy&per_page=100" > "$deployments_json"
          deployment_id="$("$NODE_24_BIN" -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(r)||r.length!==1||!Number.isSafeInteger(r[0].id)||r[0].id<=0)process.exit(1);process.stdout.write(String(r[0].id))' "$deployments_json")"
          gh api "/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=100" > "$statuses_json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest" > "$jobs_json"
          "$NODE_24_BIN" --input-type=module - "$environment_json" "$deployments_json" "$statuses_json" "$jobs_json" <<'NODE'
          import { readFileSync } from "node:fs";
          const [environmentPath, deploymentsPath, statusesPath, jobsPath] = process.argv.slice(2);
          const read = (path) => JSON.parse(readFileSync(path, "utf8"));
          const environment = read(environmentPath);
          if (!Number.isSafeInteger(environment.id) || environment.id <= 0 || environment.name !== "release-promotion") throw new Error("release-promotion environment identity is invalid");
          if (!Array.isArray(environment.protection_rules) || !environment.protection_rules.some((rule) => rule?.type === "required_reviewers")) throw new Error("release-promotion required-reviewer protection is not configured");
          const deployments = read(deploymentsPath);
          if (!Array.isArray(deployments) || deployments.length !== 1) throw new Error("expected exactly one release-promotion deployment");
          const deployment = deployments[0];
          if (!Number.isSafeInteger(deployment.id) || deployment.id <= 0 || deployment.sha !== process.env.GITHUB_SHA || deployment.ref !== process.env.GITHUB_REF_NAME || deployment.environment !== "release-promotion" || deployment.original_environment !== "release-promotion" || deployment.task !== "deploy") throw new Error("deployment identity does not match this tagged run");
          const statuses = read(statusesPath);
          const matching = Array.isArray(statuses) ? statuses.filter((status) => status?.deployment_id === deployment.id) : [];
          if (matching.length === 0) throw new Error("deployment has no status");
          const latest = [...matching].sort((left, right) => Date.parse(right.updated_at ?? right.created_at ?? "") - Date.parse(left.updated_at ?? left.created_at ?? ""))[0];
          if (!latest || !Number.isSafeInteger(latest.id) || latest.id <= 0 || latest.state !== "in_progress") throw new Error("latest release-promotion status is not active");
          const jobs = read(jobsPath);
          const currentJobs = Array.isArray(jobs.jobs) ? jobs.jobs.filter((job) => job?.name === "promote-release") : [];
          if (currentJobs.length !== 1) throw new Error("current promote-release job is not unique");
          const currentJob = currentJobs[0];
          if (currentJob.status !== "in_progress" || (currentJob.conclusion !== null && currentJob.conclusion !== undefined) || currentJob.head_sha !== process.env.GITHUB_SHA || typeof currentJob.started_at !== "string") throw new Error("current promote-release job is not active for this commit");
          NODE
      - name: Promote the existing draft only after live proof
        shell: bash
        run: |
          set -euo pipefail
          export NODE_24_BIN="$(command -v node)"
          test "$($NODE_24_BIN --version)" = "v24.12.0"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,targetCommitish > "$RUNNER_TEMP/release-before-promote.json"
          "$NODE_24_BIN" -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.isDraft!==true||r.tagName!==process.env.GITHUB_REF_NAME||!r.targetCommitish)process.exit(1)' "$RUNNER_TEMP/release-before-promote.json"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
